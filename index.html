<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Técnico - Compresor Bitzer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; margin-top: 0; }
        .badge { background: #5bc0de; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0275d8; color: white; border: none; padding: 12px 20px; margin-top: 15px; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; }
        button:hover { background: #025aa5; }
        #response-box { margin-top: 20px; background: #eef9ff; border-left: 5px solid #0275d8; padding: 15px; border-radius: 4px; white-space: pre-line; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Asistente de Fallas - Bitzer OS Series</h2>
    <span class="badge" id="eq-badge">Equipo: Cargando...</span>

    <label for="falla">Describa la falla, síntoma o código de error:</label>
    <textarea id="falla" rows="4" placeholder="Ej: El compresor se detuvo por el presóstato de aceite, suena burbujeo en la mirilla..."></textarea>

    <button onclick="consultarIA()">Consultar Solución Técnica</button>

    <div id="response-box"></div>
</div>

<script>
    // Obtener el ID del equipo desde la URL del QR (Ej: ?equipo=COMPRENSOR-01)
    const urlParams = new URLSearchParams(window.location.search);
    const equipoId = urlParams.get('equipo') || 'Bitzer-OS-General';
    document.getElementById('eq-badge').innerText = `Equipo Conectado: ${equipoId}`;

async function consultarIA() {
    const descripcionFalla = document.getElementById('falla').value;
    const box = document.getElementById('response-box');
    
    if (!descripcionFalla) {
        alert('Por favor describe la falla.');
        return;
    }

    box.style.display = 'block';
    box.innerHTML = 'Consultando manual técnico en AI Studio...';

    // Tu API Key de Google AI Studio (reemplaza con tu clave real)
    const apiKey = "AQ.Ab8RN6Lx1hm3ALAYCITZSBp33kzvGGgKUQVCFhNo61wBLsvnKQ"; 
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    const promptContexto = `Actúa como un experto en mantenimiento de compresores Bitzer (Manual SB-500-2). El equipo es ${equipoId}. El técnico reporta la siguiente falla o síntoma: "${descripcionFalla}". Da un diagnóstico estructurado de causa probable, precauciones de seguridad (como presión de gas N2 o superficies calientes) y pasos de solución exactos.`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptContexto }] }]
            })
        });

        const data = await response.json();
        const respuestaAI = data.candidates[0].content.parts[0].text;
        
        box.innerHTML = `<strong>Diagnóstico del Asistente IA:</strong><br><br>` + respuestaAI.replace(/\n/g, '<br>');
    } catch (error) {
        box.innerHTML = 'Hubo un error al conectar con la IA. Verifica tu clave de API.';
    }
}

</script>

</body>
</html>
